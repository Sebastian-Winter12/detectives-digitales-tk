<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Detectives Digitales</title>
<style>
:root{--bg:#0f1b3d;--ink:#fff;--c:#ff7a59;--ok:#2ec4a6;--no:#ff5d73;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
body{background:radial-gradient(circle at 20% 10%,#2a4396 0,transparent 45%),linear-gradient(#0f1b3d,#0a1230)}
body:before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px) 0 0/44px 44px,linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px) 0 0/44px 44px;pointer-events:none}
#app{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 16px max(10px,env(safe-area-inset-bottom));text-align:center}
h1{font-size:clamp(34px,7vw,72px);margin:0;text-shadow:0 5px 0 #0006}
h2{font-size:clamp(24px,4.5vw,44px);margin:6px 0}
p{font-size:clamp(18px,2.8vw,28px);line-height:1.35;margin:8px 0}
.byte{font-size:clamp(80px,16vw,170px);animation:fl 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 0 #0005)}
@keyframes fl{50%{transform:translateY(-12px) rotate(3deg)}}
button{font:inherit;font-weight:800;font-size:clamp(18px,2.8vw,28px);color:#fff;border:0;border-radius:24px;padding:14px 26px;min-height:60px;background:var(--c);box-shadow:0 7px 0 #0006;cursor:pointer;touch-action:manipulation;transition:transform .1s}
button:active{transform:translateY(5px);box-shadow:0 2px 0 #0006}
button:disabled{opacity:.55}
.big{background:var(--ok);font-size:clamp(22px,3.5vw,34px);padding:18px 44px}
.bubble{background:#fff;color:#14204a;border-radius:28px;padding:18px 26px;max-width:760px;box-shadow:0 8px 0 #0005;margin:10px 0 18px}
#fs{position:fixed;right:10px;bottom:10px;z-index:5;min-height:46px;padding:6px 12px;font-size:22px;background:#ffffff33;box-shadow:none}
.map{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:1000px;margin:12px 0}
.node{width:min(168px,22vw);min-width:130px;padding:12px 8px;border-radius:26px;background:var(--c);box-shadow:0 8px 0 #0006;display:flex;flex-direction:column;gap:2px;align-items:center}
.node b{font-size:40px}.node span{font-size:16px;line-height:1.2}.node.lock{background:#46527f;opacity:.7}
.bar{width:min(620px,90%);height:22px;border-radius:12px;background:#0006;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--ok));transition:width .5s}
.game{width:100%;max-width:980px;height:100%;display:flex;flex-direction:column;gap:6px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:clamp(15px,2.4vw,24px);font-weight:800;background:#0006;border-radius:20px;padding:8px 16px;border-bottom:5px solid var(--c)}
.track{position:relative;height:16px;margin:10px 22px 0;border-radius:9px;background:#0006}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--c);transition:width .5s}
.track em{position:absolute;top:-16px;font-style:normal;font-size:30px;transform:translateX(-50%);transition:left .5s}
.game small{font-size:clamp(14px,2vw,19px);opacity:.85}
main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;min-height:0;overflow:auto}
.q{background:#fff;color:#14204a;border-radius:26px;padding:14px 24px;font-weight:800;box-shadow:0 7px 0 var(--c);max-width:100%;margin:0;font-size:clamp(18px,2.8vw,28px)}
.opts{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.opts button{min-width:min(240px,42%)}
.opts button.ok{background:var(--ok);animation:pop .5s}.opts button.bad{background:#59658f;text-decoration:line-through}
.opts button.sel{background:var(--gold);color:#14204a;transform:scale(1.08)}
.opts button.card{font-family:"Courier New",monospace;font-size:clamp(16px,2.4vw,24px);background:#2b3c78;min-width:0}
.opts button.gone{animation:gone .4s forwards}@keyframes gone{to{transform:scale(0);opacity:0}}
#bins button{background:var(--c);min-width:min(300px,45%)}
.url{font:800 clamp(20px,4.2vw,44px) "Courier New",monospace;background:#070d22;border:4px solid #fff4;border-radius:18px;padding:12px 20px;max-width:100%;overflow-wrap:anywhere}
@keyframes pop{40%{transform:scale(1.18)}}
.br{width:min(760px,100%);background:#dfe6f7;color:#14204a;border-radius:20px;padding:10px 14px;box-shadow:0 7px 0 var(--c);display:grid;gap:4px;text-align:left}
.br label{font-size:clamp(13px,1.8vw,17px);font-weight:800}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0;font:700 clamp(17px,2.8vw,26px) "Courier New",monospace;border:3px solid #7d8ab5;border-radius:14px;padding:8px 12px;user-select:text;-webkit-user-select:text}
.row button{min-height:50px;padding:6px 16px;font-size:clamp(16px,2.2vw,22px);box-shadow:0 4px 0 #0006}
.pg{font-weight:800;text-align:center;min-height:24px}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-12px)}75%{transform:translateX(12px)}}
.scene{font-size:clamp(44px,8vw,80px)}
footer{display:flex;align-items:center;gap:12px;min-height:80px;padding-right:56px}
#msg{flex:1;text-align:left;border-radius:20px;padding:10px 16px;font-size:clamp(15px,2.3vw,22px);font-weight:700;background:#0006;line-height:1.25}
#msg.ok{background:#1b7f6b}#msg.bad{background:#a43a4d}
#hint{background:var(--gold);color:#14204a}
.stars{font-size:clamp(50px,10vw,90px);letter-spacing:6px}
.cf{position:fixed;top:-40px;font-size:30px;pointer-events:none;z-index:9;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;font-size:clamp(14px,2.1vw,21px);margin:8px 0;text-align:left}
@media(max-height:560px){.byte{font-size:70px}p{font-size:17px}footer{min-height:66px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.ghost{background:#ffffff22;box-shadow:none;min-height:44px;font-size:16px;padding:6px 16px;margin-top:8px}
.k{font-family:"Courier New",monospace;color:#c2255c}

let S;
function reset(){S={pts:0,stars:[0,0,0,0,0,0,0],unl:1,lv:0,qi:0,lives:4,first:0,tries:0,solved:false,streak:0,lvStart:0,step:null}}
const KEY='detectives_digitales_v1';
function save(){try{localStorage.setItem(KEY,JSON.stringify({pts:S.pts,stars:S.stars,unl:S.unl}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.stars)&&d.stars.length===7){S.pts=+d.pts||0;S.stars=d.stars.map(x=>Math.min(3,Math.max(0,+x||0)));S.unl=Math.min(7,Math.max(1,+d.unl||1))}}catch(e){}}
const has=()=>S.stars.some(Boolean);
function wipe(){try{localStorage.removeItem(KEY)}catch(e){}reset()}
const delBtn=()=>`<button class=ghost id=del>🗑️ Borrar progreso</button>`;
function wireDel(){const b=$('#del');if(!b)return;let ar=0;b.onclick=()=>{if(!ar){ar=1;b.textContent='⚠️ ¿Seguro? Tocá de nuevo';setTimeout(()=>{ar=0;if(b.isConnected)b.textContent='🗑️ Borrar progreso'},4000)}else{wipe();start()}}}
reset();load();
const cur=()=>LV[S.lv].items[S.qi];
function boom(n){for(let i=0;i<(n||26);i++){const s=document.createElement('span');s.className='cf';s.textContent=rnd(['🎉','⭐','✨','🔹','🎊']);s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),3500)}}
const stars=n=>'⭐'.repeat(n)+'☆'.repeat(3-n);
function start(){app.style.setProperty('--c','#ff7a59');app.innerHTML=`<div class=byte>🤖</div><h1>🔎 DETECTIVES<br>DIGITALES</h1><p>Aventura de navegación segura</p><button class=big id=go>▶ ${has()?'Continuar':'¡Jugar!'}</button>${has()?`<p style="font-size:16px;margin:6px">💾 Progreso guardado: ⭐ ${S.pts} puntos</p>`+delBtn():''}`;$('#go').onclick=()=>has()?map():intro(0);wireDel()}
const INTRO=['¡Hola! Soy BYTE, un robot explorador. Mis páginas de Internet se perdieron y no puedo encontrarlas. 😢','Necesito un detective digital. Vas a cumplir 7 misiones sobre direcciones, búsquedas y navegación segura. 🔎','Dos reglas: para ir a una página, escribí la dirección exacta (como youtube.com o https://…) en la barra de direcciones. Para buscar algo, escribí palabras clave en el buscador. 🧭','Regla de oro: si un enlace es desconocido o tenés dudas, no lo abras. ¡Consultá a un adulto de confianza! 🛡️'];
function intro(i){app.innerHTML=`<div class=byte>🤖</div><div class=bubble><p>${INTRO[i]}</p></div><button class=big id=nx>${i<3?'Siguiente ▶':'¡Acepto la misión!'}</button>`;$('#nx').onclick=()=>i<3?intro(i+1):map()}
function map(){const done=S.stars.filter(Boolean).length;
app.innerHTML=`<h2>🗺️ Mapa de misiones</h2><div class=bar><i style="width:${Math.round(done/7*100)}%"></i></div><p>Misiones completadas: ${done} de 7 · ⭐ ${S.pts} puntos</p><div class=map>${LV.map((l,i)=>{const o=i<S.unl;return `<button class="node ${o?'':'lock'}" style="--c:${l.c}" data-i="${i}" ${o?'':'disabled'}><b>${o?l.i:'🔒'}</b><span>Misión ${i+1}<br>${l.n}</span><span>${stars(S.stars[i])}</span></button>`}).join('')}</div>${has()?delBtn():''}`;
app.querySelectorAll('.node').forEach(b=>b.onclick=()=>begin(+b.dataset.i));wireDel()}
function begin(i){S.lv=i;S.qi=0;S.lives=4;S.first=0;S.lvStart=S.pts;S.streak=0;const L=LV[i];
app.style.setProperty('--c',L.c);
app.innerHTML=`<div class=byte style="font-size:100px">${L.i}</div><h2 style="color:var(--c)">Misión ${i+1}</h2><h1 style="font-size:clamp(28px,5vw,52px)">${L.n}</h1><div class=bubble><p>🤖 ${L.s}</p></div><button class=big id=st>¡Empezar!</button>`;$('#st').onclick=question}
function hud(){const l=$('#lv');if(!l)return;l.textContent='❤️'.repeat(S.lives)+'🖤'.repeat(4-S.lives)+(S.streak>1?'  🔥x'+S.streak:'');$('#pt').textContent='⭐ '+S.pts}
const msg=(t,c)=>{const m=$('#msg');if(m){m.textContent=t;m.className=c}};
function shake(){const m=$('main');m.classList.remove('shake');void m.offsetWidth;m.classList.add('shake')}
function setStep(s){S.step=s;$('#qq').innerHTML=s.q;const u=$('#ub');if(u){u.style.display=(s.a&&!s.hide)?'':'none';u.textContent=s.a||'';$('#ad').value='';$('#sr').value=''}}
function question(){const L=LV[S.lv],it=cur(),n=L.items.length;S.tries=0;S.solved=false;S.sel=null;S.step=it;
const pct=Math.round(S.qi/n*100);let st='';
if(it.t==='c'){const idx=it.fx?it.o.map((_,i)=>i):shuf(it.o.map((_,i)=>i));
 st=(it.sc?`<div class=scene>${it.sc}</div>`:'')+`<div class=opts>${idx.map(i=>`<button data-i="${i}" ${it.mono?'style="font-family:Courier New,monospace;font-size:clamp(16px,2.5vw,24px)"':''}>${it.o[i]}</button>`).join('')}</div>`}
else if(it.t==='s'){S.left=it.c.length;
 st=`<div class=opts id=cards>${shuf(it.c.map((_,i)=>i)).map(i=>`<button class=card data-i="${i}">${it.c[i][0]}</button>`).join('')}</div><div class=opts id=bins><button data-b="0">⌨️ Barra de direcciones</button><button data-b="1">🔍 Buscador</button></div>`}
else{const at='autocapitalize=off autocomplete=off autocorrect=off spellcheck=false enterkeyhint=go';
 st=`<div class=url id=ub style="display:none"></div><div class=br><label>⌨️ Barra de direcciones</label><div class=row><input id=ad ${at} placeholder="Escribí la dirección acá"><button id=gA>Ir</button></div><label>🔍 Buscador</label><div class=row><input id=sr ${at} placeholder="Escribí palabras clave acá"><button id=gS>Buscar</button></div><div class=pg id=pg></div></div>`}
app.innerHTML=`<div class=game style="--c:${L.c}"><header><span>${L.i} Misión ${S.lv+1}: ${L.n}</span><span id=lv></span><span id=pt></span></header>
<div class=track><i style="width:${pct}%"></i><em style="left:${Math.max(pct,3)}%">🤖</em></div><small>Actividad ${S.qi+1} de ${n} · Misión ${S.lv+1} de 7</small>
<main><p class=q id=qq>${it.q}</p><div id=stage style="display:contents">${st}</div></main>
<footer><div id=msg>🤖 Pensá bien. ¡Podés pedir una pista!</div><button id=hint>💡 Pista</button><button id=next style="display:none;background:var(--ok)">Siguiente ▶</button></footer></div>`;
hud();$('#hint').onclick=()=>msg('💡 '+S.step.h,'');$('#next').onclick=nextQ;
if(it.t==='m'){setStep(it);
 const go=k=>{if(S.solved)return;const s=S.step,v=$(k==='a'?'#ad':'#sr').value.trim();if(!v){msg('✍️ Primero escribí algo.','');return}
  if(k==='a'){if(!s.a)return lose(null,'Para buscar cosas usá el buscador 🔍 con palabras clave, no la barra de direcciones.');v===s.a?done():typo(v,s.a)}
  else{if(s.a)return lose(null,'Esto es una dirección: va en la barra de direcciones ⌨️, no en el buscador.');
   if(/^https?:\/\//i.test(v)||/^\S+\.(com|org|net|ar)(\/\S*)?$/i.test(v))return lose(null,'Eso es una dirección. Para buscar, escribí palabras clave.');
   const nv=norm(v);if(s.kw.some(w=>nv.includes(w)))done();else{S.tries++;S.streak=0;hud();msg('Probá con otras palabras clave que digan qué querés encontrar.','bad')}}};
 $('#gA').onclick=()=>go('a');$('#gS').onclick=()=>go('s');
 $('#ad').onkeydown=e=>{if(e.key==='Enter')go('a')};$('#sr').onkeydown=e=>{if(e.key==='Enter')go('s')}}
else if(it.t==='s'){$('#stage').onclick=e=>{if(S.solved)return;const b=e.target.closest('button');if(!b)return;
 if(b.classList.contains('card')){document.querySelectorAll('.card').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');S.sel=b;return}
 if(!S.sel){msg('👆 Primero tocá una tarjeta.','');return}
 const c=S.sel,right=it.c[+c.dataset.i][1];if(right===+b.dataset.b){c.classList.add('gone');c.disabled=true;S.sel=null;S.left--;msg('✔️ ¡Bien! Quedan '+S.left+' tarjetas.','ok');if(!S.left)win(null)}
 else{c.classList.remove('sel');S.sel=null;lose(null,'¡Casi! '+(right===0?'Eso es una dirección: va en la barra de direcciones.':'Eso son palabras clave: van en el buscador.'))}}}
else $('#stage').onclick=e=>{const b=e.target.closest('button');if(!b||S.solved)return;const i=+b.dataset.i;i===it.a?win(b):lose(b)}}
function done(){const s=S.step;if(s.nx){setStep(s.nx);msg('✅ ¡Paso 1 listo! Ahora el paso 2.','ok');boom(8)}else win(null)}
function typo(v,a){S.tries++;S.streak=0;let m;
 if(/^https:\/\//.test(a)){if(/^http:\/\//i.test(v))m='Tiene que empezar con https:// (con la s).';else if(!/^https:\/\//.test(v))m='Falta el comienzo: https://'}
 if(!m){if(/\s/.test(v))m='Hay un espacio. Las direcciones no llevan espacios.';
  else if(/^https?:\/\//i.test(v)&&!/^https?:\/\//.test(a))m='Escribila tal cual se ve, sin agregar nada adelante.';
  else{let i=0;while(i<a.length&&v[i]===a[i])i++;m='Revisá desde la letra número '+(i+1)+'. Tiene que ser igual, letra por letra.'}}
 msg('¡Casi! '+m,'bad');shake();hud()}
function win(b){const s=S.step;S.solved=true;if(b)b.classList.add('ok');
 let bonus=0;if(!S.tries){S.streak++;bonus=Math.min(S.streak-1,3)*2}else S.streak=0;
 S.pts+=(S.tries?5:10)+bonus;if(!S.tries)S.first++;hud();
 document.querySelectorAll('#stage button,#stage input').forEach(x=>x.disabled=true);
 const pg=$('#pg');if(pg)pg.textContent=s.a?'✅ ¡BYTE entró a la página!':'✅ ¡Encontraste resultados!';
 msg(rnd(GOOD)+' '+s.e+(bonus?' 🔥 ¡Racha! +'+bonus:''),'ok');boom(14);$('#next').style.display='';$('#hint').style.display='none'}
function lose(b,c){S.lives--;S.tries++;S.streak=0;if(b){b.classList.add('bad');b.disabled=true}
 shake();msg(c||(rnd(BAD)+(S.tries>1?' 💡 '+S.step.h:'')),'bad');hud();if(S.lives<=0)setTimeout(over,1300)}
function over(){S.pts=S.lvStart;app.innerHTML=`<div class=byte>🔋</div><h2>¡BYTE necesita recargar energía!</h2><div class=bubble><p>¡No pasa nada, detective! Equivocarse es parte de aprender. Vamos a intentarlo de nuevo.</p></div><button class=big id=rt>🔄 Reintentar misión</button>`;$('#rt').onclick=()=>begin(S.lv)}
function nextQ(){S.qi++;S.qi<LV[S.lv].items.length?question():endLevel()}
function endLevel(){const n=LV[S.lv].items.length,r=S.first/n,s=r>=.85?3:r>=.6?2:1;S.stars[S.lv]=Math.max(S.stars[S.lv],s);
if(S.lv+1<7)S.unl=Math.max(S.unl,S.lv+2);save();const last=S.lv===6;
app.innerHTML=`<div class=byte>🥳</div><h2>¡Misión ${S.lv+1} completada!</h2><div class=stars>${stars(s)}</div><p>${S.first} de ${n} actividades a la primera · ⭐ ${S.pts} puntos</p><p style="font-size:16px">💾 Progreso guardado</p><button class=big id=ct>${last?'🏆 Ver resultado final':'🗺️ Volver al mapa'}</button>`;
boom(40);$('#ct').onclick=()=>last?fin():map()}
function fin(){const tot=S.stars.reduce((a,b)=>a+b,0),rk=tot>=18?'🏅 Detective Maestro':tot>=13?'🥈 Detective Experto':'🥉 Detective Aprendiz';
app.innerHTML=`<div class=byte>🤖🎉</div><h2>¡FELICITACIONES, DETECTIVE!</h2><p>BYTE recuperó todas sus páginas gracias a tu ayuda. Ahora sos un experto en enlaces y navegación segura.</p><p><b>${rk} · ⭐ ${S.pts} puntos · Estrellas: ${tot} de 21</b></p><div class=sum>${LV.map((l,i)=>`<div>${l.i} ${l.n}: ${stars(S.stars[i])}</div>`).join('')}</div><button class=big id=ag>🔄 Jugar de nuevo (borra el progreso)</button>`;
boom(60);const iv=setInterval(()=>{if(!$('#ag')){clearInterval(iv);return}boom(10)},2500);$('#ag').onclick=()=>{clearInterval(iv);wipe();start()}}
$('#fs').onclick=()=>{const d=document,e=d.documentElement;try{d.fullscreenElement?d.exitFullscreen():(e.requestFullscreen||e.webkitRequestFullscreen).call(e)}catch(x){}};
start();
</script></body></html>
